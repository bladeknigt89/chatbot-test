services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: sqlite:////data/app.db
      VECTOR_DB_PATH: /data/vector.db
      STORAGE_PATH: /data/uploads
      LOG_PATH: /data/logs
      LLM_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
      LLM_SKIP_CHECK: "false"
    volumes:
      - chatbot-data:/data
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      VECTOR_DB_PATH: /data/vector.db
      STORAGE_PATH: /data/uploads
      LOG_PATH: /data/logs
      LLM_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
      LLM_SKIP_CHECK: "true"
    volumes:
      - chatbot-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.workers.run"]
    depends_on:
      - backend

volumes:
  chatbot-data:
